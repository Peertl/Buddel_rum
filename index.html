<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buddel rum! (v0.7)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #e5b85c; 
        }
        
        /* --- Ladebildschirm --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #e5b85c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #5a3d17;
        }

        #loading-screen h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #fff;
        }

        .progress-bar-container {
            width: 70%;
            max-width: 300px;
            height: 25px;
            border: 3px solid #5a3d17;
            background-color: #d4a351;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #8b5a2b;
            transition: width 0.3s ease;
        }

        /* --- Spielbereich --- */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh; 
            max-width: 600px;
            margin: 0 auto;
            background-image: url('Hintergrund.png');
            background-size: cover;
            background-position: center 80%; 
            overflow: hidden;
            display: none; 
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 84%;
            height: 50%; 
            position: absolute;
            top: 35%; 
            left: 8%;
            z-index: 10;
        }

        .field {
            /* border: 1px solid rgba(0,0,0,0.1); /* Zum Testen einkommentieren */
            position: relative;
            cursor: pointer;
            pointer-events: auto;
        }

        /* DER ANKERPUNKT: 0x0 Pixel, bewegt sich über den Sand */
        #schnabel {
            position: absolute;
            width: 0;
            height: 0;
            z-index: 20;
            pointer-events: none;
        }

        /* DAS BILD: Richtet sich stur mit der unteren Mitte am Ankerpunkt aus */
        #schnabel img {
            position: absolute;
            bottom: 0;
            left: -60px; /* Exakt die Hälfte der 120px Breite nach links schieben */
            width: 120px;
            height: auto;
            transform-origin: bottom center;
            display: block;
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <h1>Expedition startet...
</h1>
    <div class="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
</div>

<div id="game-container">
    <div id="grid">
        <div class="field" data-index="1" data-x="1" data-y="1"></div>
        <div class="field" data-index="2" data-x="2" data-y="1"></div>
        <div class="field" data-index="3" data-x="3" data-y="1"></div>
        <div class="field" data-index="4" data-x="1" data-y="2"></div>
        <div class="field" data-index="5" data-x="2" data-y="2"></div>
        <div class="field" data-index="6" data-x="3" data-y="2"></div>
        <div class="field" data-index="7" data-x="1" data-y="3"></div>
        <div class="field" data-index="8" data-x="2" data-y="3"></div>
        <div class="field" data-index="9" data-x="3" data-y="3"></div>
        <div class="field" data-index="10" data-x="1" data-y="4"></div>
        <div class="field" data-index="11" data-x="2" data-y="4"></div>
        <div class="field" data-index="12" data-x="3" data-y="4"></div>
    </div>

    <div id="schnabel">
        <img id="schnabel-img" src="Schnabel_stehend.png" alt="Schnabel">
    </div>
</div>

<script>
    const imagesToLoad = [
        'Hintergrund.png', 'Schnabel_stehend.png',
        'Schnabel_laufend_links_1.png', 'Schnabel_laufend_links_2.png',
        'Schnabel_laufend_rechts_1.png', 'Schnabel_laufend_rechts_2.png',
        'Schnabel_laufend_zurück_links_1.png', 'Schnabel_laufend_zurück_links_2.png',
        'Schnabel_laufend_zurück_rechts_1.png', 'Schnabel_laufend_zurück_rechts_2.png'
    ];
    let loadedImages = 0;

    function imageLoaded() {
        loadedImages++;
        document.getElementById('progress-bar').style.width = (loadedImages / imagesToLoad.length * 100) + '%';
        if (loadedImages === imagesToLoad.length) {
            setTimeout(initGame, 500); 
        }
    }

    imagesToLoad.forEach(src => {
        const img = new Image();
        img.onload = imageLoaded;
        img.onerror = imageLoaded; 
        img.src = src;
    });

    const fields = document.querySelectorAll('.field');
    const schnabel = document.getElementById('schnabel'); // Der Anker-Div
    const schnabelImg = document.getElementById('schnabel-img'); // Das Bild im Div
    const gridEl = document.getElementById('grid');
    
    let isMoving = false;
    let walkStep = 1;
    let walkInterval = null;
    let currentDirection = null; // Speichert die Laufrichtung
    
    // Start über Feld 1
    let currentGridPos = { x: 1, y: 0.5 }; 

    function initGame() {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        
        setTimeout(() => {
            const startCoords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
            updateSchnabelVisuals(startCoords.x, startCoords.y);
        }, 50);
    }

    function getPixelCoordsFromGrid(gX, gY) {
        const rect = gridEl.getBoundingClientRect();
        const container = document.getElementById('game-container').getBoundingClientRect();
        
        const cellWidth = rect.width / 3;
        const cellHeight = rect.height / 4;

        const pxX = (rect.left - container.left) + (gX - 0.5) * cellWidth;
        const pxY = (rect.top - container.top) + (gY - 0.5) * cellHeight;
        
        return { x: pxX, y: pxY };
    }

    function updateSchnabelVisuals(pxX, pxY) {
        // Exakte Y-Referenzpunkte auf dem Grid: Startposition (y0.5) und Feld 4 (y4.0)
        const yStart = getPixelCoordsFromGrid(1, 0.5).y;
        const yBottom4 = getPixelCoordsFromGrid(1, 4.0).y;
        
        // Berechnung: Wieviel Prozent ist er vom Start bis zum untersten Feld fortgeschritten?
        let progressFromStart = (pxY - yStart) / (yBottom4 - yStart);
        progressFromStart = Math.max(0, Math.min(1, progressFromStart)); 
        
        // Skalierung: Oben (Start-gY=0.5) = 0.50, Unten (Feld 4-gY=4.0) = 1.00
        const scaleBase = 0.50 + (progressFromStart * 0.50); 
        let finalScale = scaleBase;

        // --- Korrekturfaktor für Rückwärts-Bilder ---
        // Wenn Schnabel nach hinten läuft, verkleinern wir das Bild zusätzlich, 
        // um visuelle Unterschiede der Bilder auszugleichen.
        if (currentDirection && currentDirection.startsWith('zurück_')) {
            finalScale = scaleBase * 0.85; // Visuell um 15 % verkleinern
        }

        // Setze den Ankerpunkt exakt auf die Pixel-Koordinate
        schnabel.style.left = pxX + 'px'; 
        schnabel.style.top = pxY + 'px'; 
        
        // Skaliere das Bild relativ zu diesem Anker
        schnabelImg.style.transform = `scale(${Math.max(0.1, finalScale)})`; 
        
        return scaleBase; // Wir geben die korrekte Basis-Skalierung für die Geschwindigkeit zurück
    }

    function startWalkAnimation(fromX, fromY, toX, toY) {
        clearInterval(walkInterval);
        
        currentDirection = "";
        let dx = toX - fromX;
        let dy = toY - fromY;

        if (Math.abs(dx) < 1) { 
            // Vertikal
            if (dy < 0) currentDirection = "zurück_rechts"; 
            else currentDirection = "rechts";               
        } else if (dx < 0) {
            // Links
            if (dy < 0) currentDirection = "zurück_links";  
            else currentDirection = "links";                
        } else {
            // Rechts
            if (dy < 0) currentDirection = "zurück_rechts"; 
            else currentDirection = "rechts";               
        }

        walkStep = 1;
        schnabelImg.src = `Schnabel_laufend_${currentDirection}_${walkStep}.png`;

        walkInterval = setInterval(() => {
            walkStep = walkStep === 1 ? 2 : 1;
            schnabelImg.src = `Schnabel_laufend_${currentDirection}_${walkStep}.png`;
        }, 180); 
    }

    function stopWalkAnimation() {
        clearInterval(walkInterval);
        schnabelImg.src = 'Schnabel_stehend.png';
        walkStep = 1;
        currentDirection = null; // Richtung zurücksetzen
    }

    function moveToTarget(targetX, targetY) {
        const startCoords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
        const targetCoords = getPixelCoordsFromGrid(targetX, targetY);

        startWalkAnimation(startCoords.x, startCoords.y, targetCoords.x, targetCoords.y);

        const startX = startCoords.x;
        const startY = startCoords.y;
        
        const distance = Math.sqrt(Math.pow(targetCoords.x - startX, 2) + Math.pow(targetCoords.y - startY, 2));
        
        const startScaleBase = updateSchnabelVisuals(startX, startY);
        const endScaleBase = updateSchnabelVisuals(targetCoords.x, targetCoords.y);
        const avgScaleBase = (startScaleBase + endScaleBase) / 2;
        
        const duration = (distance * 6) / avgScaleBase; 
        
        let startTime = null;

        function animate(time) {
            if (!startTime) startTime = time;
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / duration, 1);

            const currentPxX = startX + (targetCoords.x - startX) * progress;
            const currentPxY = startY + (targetCoords.y - startY) * progress;

            // Übergibt die aktuelle Pixel-Position und die aktuelle Richtung
            updateSchnabelVisuals(currentPxX, currentPxY);

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                currentGridPos.x = targetX;
                currentGridPos.y = targetY;
                isMoving = false;
                stopWalkAnimation();
                // Damit er nach dem Stop die korrekte Größe ohne Korrekturfaktor hat:
                const finalCoords = getPixelCoordsFromGrid(targetX, targetY);
                updateSchnabelVisuals(finalCoords.x, finalCoords.y);
                console.log("Perfekt und ohne Ruckler am Ziel angekommen!");
                // HIER KOMMT DIE BUDDEL-ANIMATION HIN
            }
        }
        requestAnimationFrame(animate);
    }

    fields.forEach(field => {
        field.addEventListener('click', (e) => {
            if (isMoving) return;

            const tX = parseInt(e.target.dataset.x);
            const tY = parseInt(e.target.dataset.y);

            if(tX === currentGridPos.x && tY === currentGridPos.y) return;

            isMoving = true;
            moveToTarget(tX, tY); 
        });
    });
</script>

</body>
</html>
