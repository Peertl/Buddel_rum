<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buddel rum! (v0.3)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #e5b85c;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            background-image: url('Hintergrund.png');
            background-size: cover;
            background-position: center bottom;
            overflow: hidden;
        }

        /* Felder weiter oben platziert */
        #grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 80%;
            height: 55%; 
            position: absolute;
            top: 25%; /* Weiter nach oben verschoben */
            left: 10%;
            z-index: 10;
        }

        .field {
            /* border: 1px dashed rgba(0,0,0,0.3); /* Zum Testen einkommentieren */
            position: relative;
            cursor: pointer;
            pointer-events: auto;
        }

        #schnabel {
            position: absolute;
            width: 120px;
            /* Transform origin unten Mitte, damit er beim Skalieren nicht "schwebt" */
            transform-origin: bottom center;
            z-index: 20;
            pointer-events: none;
        }

        #schnabel img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="grid">
        <div class="field" data-index="1" data-x="1" data-y="1"></div>
        <div class="field" data-index="2" data-x="2" data-y="1"></div>
        <div class="field" data-index="3" data-x="3" data-y="1"></div>
        <div class="field" data-index="4" data-x="1" data-y="2"></div>
        <div class="field" data-index="5" data-x="2" data-y="2"></div>
        <div class="field" data-index="6" data-x="3" data-y="2"></div>
        <div class="field" data-index="7" data-x="1" data-y="3"></div>
        <div class="field" data-index="8" data-x="2" data-y="3"></div>
        <div class="field" data-index="9" data-x="3" data-y="3"></div>
        <div class="field" data-index="10" data-x="1" data-y="4"></div>
        <div class="field" data-index="11" data-x="2" data-y="4"></div>
        <div class="field" data-index="12" data-x="3" data-y="4"></div>
    </div>

    <div id="schnabel">
        <img id="schnabel-img" src="Schnabel_stehend.png" alt="Schnabel">
    </div>
</div>

<script>
    const fields = document.querySelectorAll('.field');
    const schnabel = document.getElementById('schnabel');
    const schnabelImg = document.getElementById('schnabel-img');
    
    // Status-Variablen
    let isMoving = false;
    let walkStep = 1;
    let walkInterval = null;
    let currentPath = [];
    
    // Schnabels exakte Position auf dem Bildschirm
    let currentPos = { x: 0, y: 0, gridX: 1, gridY: 0 }; // gridY 0 = Start oberhalb Feld 1

    // Wartet, bis das Layout geladen ist, um die Startposition zu berechnen
    window.addEventListener('load', () => {
        const field1 = document.querySelector('.field[data-index="1"]');
        const coords = getFieldCenter(field1);
        
        // Startposition: Selbe X-Achse wie Feld 1, aber weiter oben (Y - 60px)
        currentPos.x = coords.x;
        currentPos.y = coords.y - 60; 
        
        updateSchnabelVisuals(currentPos.x, currentPos.y, currentPos.gridY);
    });

    // Berechnet die absolute Pixel-Mitte eines Feldes
    function getFieldCenter(fieldEl) {
        const rect = fieldEl.getBoundingClientRect();
        const container = document.getElementById('game-container').getBoundingClientRect();
        return {
            x: rect.left - container.left + (rect.width / 2),
            y: rect.top - container.top + (rect.height / 1.5)
        };
    }

    // Aktualisiert Position und Skalierung (klein = oben, groß = unten)
    function updateSchnabelVisuals(pxX, pxY, gridY) {
        // Skalierung von 0.45 (Start) bis 1.0 (Feld 4)
        const scale = 0.45 + (gridY / 4) * 0.55; 
        
        // Versatz um die halbe Breite, damit er mittig steht
        schnabel.style.left = (pxX - 60) + 'px'; // 60 ist halbe Breite (120/2)
        schnabel.style.top = (pxY - schnabel.offsetHeight) + 'px';
        schnabel.style.transform = `scale(${scale})`;
    }

    // --- Lauf-Animation ---
    function startWalkAnimation(fromX, fromY, toX, toY) {
        clearInterval(walkInterval);
        
        // Richtung bestimmen anhand der Pixel-Bewegung
        let direction = "";
        if (toY < fromY) direction += "zurück_";
        if (toX < fromX) direction += "links";
        else direction += "rechts";

        walkInterval = setInterval(() => {
            walkStep = walkStep === 1 ? 2 : 1;
            schnabelImg.src = `Schnabel_laufend_${direction}_${walkStep}.png`;
        }, 80); // Schneller! (80ms)
    }

    function stopWalkAnimation() {
        clearInterval(walkInterval);
        schnabelImg.src = 'Schnabel_stehend.png';
        walkStep = 1;
    }

    // --- Wegfindung (Der Haken) ---
    function calculatePath(targetGridX, targetGridY) {
        let path = [];
        
        // Wenn es geradeaus horizontal oder vertikal geht, baue einen Haken ein
        if (currentPos.gridX === targetGridX && currentPos.gridY !== targetGridY) {
            // Vertikaler Lauf -> Ausweichschritt zur Seite
            let pivotX = targetGridX === 3 ? 2 : targetGridX + 1;
            let pivotY = Math.max(1, Math.floor((currentPos.gridY + targetGridY) / 2));
            path.push({ x: pivotX, y: pivotY });
        } else if (currentPos.gridY === targetGridY && currentPos.gridX !== targetGridX) {
            // Horizontaler Lauf -> Ausweichschritt nach unten/oben
            let pivotY = targetGridY === 4 ? 3 : targetGridY + 1;
            let pivotX = Math.floor((currentPos.gridX + targetGridX) / 2);
            path.push({ x: pivotX, y: pivotY });
        }

        // Endziel hinzufügen
        path.push({ x: targetGridX, y: targetGridY });
        return path;
    }

    // --- Bewegungsschleife ---
    function moveNextSegment() {
        if (currentPath.length === 0) {
            isMoving = false;
            stopWalkAnimation();
            console.log("Angekommen!");
            // HIER KOMMT SPÄTER DER BUDDEL-AUFRUF
            return;
        }

        const nextTarget = currentPath.shift();
        const fieldEl = document.querySelector(`.field[data-x="${nextTarget.x}"][data-y="${nextTarget.y}"]`);
        const targetCoords = getFieldCenter(fieldEl);

        startWalkAnimation(currentPos.x, currentPos.y, targetCoords.x, targetCoords.y);

        const startX = currentPos.x;
        const startY = currentPos.y;
        const startGridY = currentPos.gridY;
        const targetGridY = nextTarget.y;
        
        const duration = 1200; // 1.2 Sekunden pro Teilstrecke
        let startTime = null;

        function animate(time) {
            if (!startTime) startTime = time;
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Interpolation der Werte
            currentPos.x = startX + (targetCoords.x - startX) * progress;
            currentPos.y = startY + (targetCoords.y - startY) * progress;
            const currentGridYAnim = startGridY + (targetGridY - startGridY) * progress;

            updateSchnabelVisuals(currentPos.x, currentPos.y, currentGridYAnim);

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                currentPos.gridX = nextTarget.x;
                currentPos.gridY = targetGridY;
                moveNextSegment(); // Nächstes Stück vom Pfad ablaufen
            }
        }
        requestAnimationFrame(animate);
    }

    // Klick-Ereignisse
    fields.forEach(field => {
        field.addEventListener('click', (e) => {
            if (isMoving) return;

            const tX = parseInt(e.target.dataset.x);
            const tY = parseInt(e.target.dataset.y);

            // Verhindern, dass er auf das gleiche Feld klickt, auf dem er steht
            if(tX === currentPos.gridX && tY === currentPos.gridY) return;

            isMoving = true;
            currentPath = calculatePath(tX, tY);
            moveNextSegment();
        });
    });
</script>

</body>
</html>
