<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buddel rum! (v0.4)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #e5b85c; /* Sandfarbe als Backup */
        }
        
        /* --- Ladebildschirm --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #e5b85c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #5a3d17;
        }

        #loading-screen h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #fff;
        }

        .progress-bar-container {
            width: 70%;
            max-width: 300px;
            height: 25px;
            border: 3px solid #5a3d17;
            background-color: #d4a351;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #8b5a2b;
            transition: width 0.3s ease;
        }

        /* --- Spielbereich --- */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh; /* Nutzt die dynamische Höhe, ignoriert Browser-Leisten */
            max-width: 600px;
            margin: 0 auto;
            background-image: url('Hintergrund.png');
            background-size: cover;
            /* Hintergrund etwas nach oben geschoben, damit unten nichts abgeschnitten wird */
            background-position: center 80%; 
            overflow: hidden;
            display: none; /* Wird erst nach dem Laden gezeigt */
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 84%;
            height: 60%; 
            position: absolute;
            top: 20%; /* Raster weiter oben platziert */
            left: 8%;
            z-index: 10;
        }

        .field {
            /* border: 1px solid rgba(0,0,0,0.1); /* Zum Testen einkommentieren */
            position: relative;
            cursor: pointer;
            pointer-events: auto;
        }

        #schnabel {
            position: absolute;
            width: 120px;
            transform-origin: bottom center;
            z-index: 20;
            pointer-events: none;
        }

        #schnabel img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <h1>Expedition startet...</h1>
    <div class="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
</div>

<div id="game-container">
    <div id="grid">
        <div class="field" data-index="1" data-x="1" data-y="1"></div>
        <div class="field" data-index="2" data-x="2" data-y="1"></div>
        <div class="field" data-index="3" data-x="3" data-y="1"></div>
        <div class="field" data-index="4" data-x="1" data-y="2"></div>
        <div class="field" data-index="5" data-x="2" data-y="2"></div>
        <div class="field" data-index="6" data-x="3" data-y="2"></div>
        <div class="field" data-index="7" data-x="1" data-y="3"></div>
        <div class="field" data-index="8" data-x="2" data-y="3"></div>
        <div class="field" data-index="9" data-x="3" data-y="3"></div>
        <div class="field" data-index="10" data-x="1" data-y="4"></div>
        <div class="field" data-index="11" data-x="2" data-y="4"></div>
        <div class="field" data-index="12" data-x="3" data-y="4"></div>
    </div>

    <div id="schnabel">
        <img id="schnabel-img" src="Schnabel_stehend.png" alt="Schnabel">
    </div>
</div>

<script>
    // --- 1. Preloader Logik ---
    const imagesToLoad = [
        'Hintergrund.png', 'Schnabel_stehend.png',
        'Schnabel_laufend_links_1.png', 'Schnabel_laufend_links_2.png',
        'Schnabel_laufend_rechts_1.png', 'Schnabel_laufend_rechts_2.png',
        'Schnabel_laufend_zurück_links_1.png', 'Schnabel_laufend_zurück_links_2.png',
        'Schnabel_laufend_zurück_rechts_1.png', 'Schnabel_laufend_zurück_rechts_2.png'
    ];
    let loadedImages = 0;

    function imageLoaded() {
        loadedImages++;
        document.getElementById('progress-bar').style.width = (loadedImages / imagesToLoad.length * 100) + '%';
        if (loadedImages === imagesToLoad.length) {
            setTimeout(initGame, 500); // Kurze Pause für den Effekt
        }
    }

    imagesToLoad.forEach(src => {
        const img = new Image();
        img.onload = imageLoaded;
        img.onerror = imageLoaded; // Verhindert ewiges Laden bei einem Tippfehler
        img.src = src;
    });


    // --- 2. Spiel Logik ---
    const fields = document.querySelectorAll('.field');
    const schnabel = document.getElementById('schnabel');
    const schnabelImg = document.getElementById('schnabel-img');
    const gridEl = document.getElementById('grid');
    
    let isMoving = false;
    let walkStep = 1;
    let walkInterval = null;
    let currentPath = [];
    
    // Grid-Koordinaten: X(1-3), Y(1-4). Y=0.2 ist knapp oberhalb von Feld 1.
    let currentGridPos = { x: 1, y: 0.2 }; 

    function initGame() {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        
        // Nach dem Einblenden kurz warten, bis das Layout gerendert ist, dann positionieren
        setTimeout(() => {
            const startCoords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
            updateSchnabelVisuals(startCoords.x, startCoords.y);
        }, 50);
    }

    // Wandelt logische Grid-Werte (auch Kommazahlen für halbe Schritte) in echte Pixel um
    function getPixelCoordsFromGrid(gX, gY) {
        const rect = gridEl.getBoundingClientRect();
        const container = document.getElementById('game-container').getBoundingClientRect();
        
        const cellWidth = rect.width / 3;
        const cellHeight = rect.height / 4;

        // gX=1 ist die Mitte von Spalte 1.
        const pxX = (rect.left - container.left) + (gX - 0.5) * cellWidth;
        const pxY = (rect.top - container.top) + (gY - 0.5) * cellHeight;
        
        return { x: pxX, y: pxY };
    }

    // Die Größe wird STRIKT an die Pixel-Y-Koordinate gekoppelt
    function updateSchnabelVisuals(pxX, pxY) {
        // Berechne die extremsten Punkte für die Skalierung
        const topY = getPixelCoordsFromGrid(1, 0).y;
        const bottomY = getPixelCoordsFromGrid(1, 4.5).y;
        
        // Wert zwischen 0 (ganz oben) und 1 (ganz unten)
        let progress = (pxY - topY) / (bottomY - topY);
        progress = Math.max(0, Math.min(1, progress)); 
        
        // Größe schwankt weich zwischen 40% und 100%
        const scale = 0.40 + (progress * 0.60); 

        schnabel.style.left = (pxX - 60) + 'px'; // Zentrieren (120px / 2)
        schnabel.style.top = (pxY - schnabel.offsetHeight) + 'px'; // Am Boden ausrichten
        schnabel.style.transform = `scale(${scale})`;
    }

    // --- Lauf-Animation ---
    function startWalkAnimation(fromX, fromY, toX, toY) {
        clearInterval(walkInterval);
        
        let direction = "";
        // Geht er auf dem Bildschirm nach oben?
        if (toY < fromY) direction += "zurück_";
        // Geht er nach links oder rechts?
        if (toX < fromX) direction += "links";
        else direction += "rechts";

        // Sofort das erste Bild setzen, damit die Beine sofort anfangen!
        walkStep = 1;
        schnabelImg.src = `Schnabel_laufend_${direction}_${walkStep}.png`;

        walkInterval = setInterval(() => {
            walkStep = walkStep === 1 ? 2 : 1;
            schnabelImg.src = `Schnabel_laufend_${direction}_${walkStep}.png`;
        }, 80); 
    }

    function stopWalkAnimation() {
        clearInterval(walkInterval);
        schnabelImg.src = 'Schnabel_stehend.png';
        walkStep = 1;
    }

    // --- Wegfindung (Der diagonale Haken) ---
    function calculatePath(targetX, targetY) {
        let path = [];
        let dx = targetX - currentGridPos.x;
        let dy = targetY - currentGridPos.y;

        // Nur horizontaler Lauf (quer)
        if (Math.abs(dy) < 0.1 && Math.abs(dx) > 0) {
            // Erst schräg nach oben, dann schräg nach unten
            let pivotX = currentGridPos.x + (dx / 2);
            let pivotY = currentGridPos.y - 0.8; // Zieht ihn "nach hinten/oben"
            path.push({ x: pivotX, y: pivotY });
        } 
        // Nur vertikaler Lauf (geradeaus nach unten/oben)
        else if (Math.abs(dx) < 0.1 && Math.abs(dy) > 0) {
            // Halber Weg diagonal zur Seite
            let pivotX = currentGridPos.x === 3 ? currentGridPos.x - 0.6 : currentGridPos.x + 0.6;
            let pivotY = currentGridPos.y + (dy / 2);
            path.push({ x: pivotX, y: pivotY });
        }

        // Ziel
        path.push({ x: targetX, y: targetY });
        return path;
    }

    // --- Bewegungsschleife ---
    function moveNextSegment() {
        if (currentPath.length === 0) {
            isMoving = false;
            stopWalkAnimation();
            return;
        }

        const nextTarget = currentPath.shift();
        
        const startCoords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
        const targetCoords = getPixelCoordsFromGrid(nextTarget.x, nextTarget.y);

        startWalkAnimation(startCoords.x, startCoords.y, targetCoords.x, targetCoords.y);

        const startX = startCoords.x;
        const startY = startCoords.y;
        
        // Geschwindigkeit anpassen: Kürzere Strecken (wie die Haken-Spitze) dauern nicht so lang
        const distance = Math.sqrt(Math.pow(targetCoords.x - startX, 2) + Math.pow(targetCoords.y - startY, 2));
        const duration = distance * 4; // Basisgeschwindigkeit
        
        let startTime = null;

        function animate(time) {
            if (!startTime) startTime = time;
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / duration, 1);

            const currentPxX = startX + (targetCoords.x - startX) * progress;
            const currentPxY = startY + (targetCoords.y - startY) * progress;

            updateSchnabelVisuals(currentPxX, currentPxY);

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                currentGridPos.x = nextTarget.x;
                currentGridPos.y = nextTarget.y;
                moveNextSegment(); 
            }
        }
        requestAnimationFrame(animate);
    }

    // Klick-Ereignisse
    fields.forEach(field => {
        field.addEventListener('click', (e) => {
            if (isMoving) return;

            const tX = parseInt(e.target.dataset.x);
            const tY = parseInt(e.target.dataset.y);

            if(tX === currentGridPos.x && tY === currentGridPos.y) return;

            isMoving = true;
            currentPath = calculatePath(tX, tY);
            moveNextSegment();
        });
    });
</script>

</body>
</html>
