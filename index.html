<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buddel rum! (v0.5)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #e5b85c; 
        }
        
        /* --- Ladebildschirm --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #e5b85c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #5a3d17;
        }

        #loading-screen h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #fff;
        }

        .progress-bar-container {
            width: 70%;
            max-width: 300px;
            height: 25px;
            border: 3px solid #5a3d17;
            background-color: #d4a351;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #8b5a2b;
            transition: width 0.3s ease;
        }

        /* --- Spielbereich --- */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh; 
            max-width: 600px;
            margin: 0 auto;
            background-image: url('Hintergrund.png');
            background-size: cover;
            background-position: center 80%; 
            overflow: hidden;
            display: none; 
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 84%;
            height: 50%; 
            position: absolute;
            top: 35%; /* Deutlich weiter nach unten geschoben */
            left: 8%;
            z-index: 10;
        }

        .field {
            /* border: 1px solid rgba(0,0,0,0.1); /* Zum Testen einkommentieren */
            position: relative;
            cursor: pointer;
            pointer-events: auto;
        }

        #schnabel {
            position: absolute;
            width: 120px;
            transform-origin: bottom center;
            z-index: 20;
            pointer-events: none;
        }

        #schnabel img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <h1>Expedition startet...</h1>
    <div class="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
</div>

<div id="game-container">
    <div id="grid">
        <div class="field" data-index="1" data-x="1" data-y="1"></div>
        <div class="field" data-index="2" data-x="2" data-y="1"></div>
        <div class="field" data-index="3" data-x="3" data-y="1"></div>
        <div class="field" data-index="4" data-x="1" data-y="2"></div>
        <div class="field" data-index="5" data-x="2" data-y="2"></div>
        <div class="field" data-index="6" data-x="3" data-y="2"></div>
        <div class="field" data-index="7" data-x="1" data-y="3"></div>
        <div class="field" data-index="8" data-x="2" data-y="3"></div>
        <div class="field" data-index="9" data-x="3" data-y="3"></div>
        <div class="field" data-index="10" data-x="1" data-y="4"></div>
        <div class="field" data-index="11" data-x="2" data-y="4"></div>
        <div class="field" data-index="12" data-x="3" data-y="4"></div>
    </div>

    <div id="schnabel">
        <img id="schnabel-img" src="Schnabel_stehend.png" alt="Schnabel">
    </div>
</div>

<script>
    // --- 1. Preloader Logik ---
    const imagesToLoad = [
        'Hintergrund.png', 'Schnabel_stehend.png',
        'Schnabel_laufend_links_1.png', 'Schnabel_laufend_links_2.png',
        'Schnabel_laufend_rechts_1.png', 'Schnabel_laufend_rechts_2.png',
        'Schnabel_laufend_zurück_links_1.png', 'Schnabel_laufend_zurück_links_2.png',
        'Schnabel_laufend_zurück_rechts_1.png', 'Schnabel_laufend_zurück_rechts_2.png'
    ];
    let loadedImages = 0;

    function imageLoaded() {
        loadedImages++;
        document.getElementById('progress-bar').style.width = (loadedImages / imagesToLoad.length * 100) + '%';
        if (loadedImages === imagesToLoad.length) {
            setTimeout(initGame, 500); 
        }
    }

    imagesToLoad.forEach(src => {
        const img = new Image();
        img.onload = imageLoaded;
        img.onerror = imageLoaded; 
        img.src = src;
    });

    // --- 2. Spiel Logik ---
    const fields = document.querySelectorAll('.field');
    const schnabel = document.getElementById('schnabel');
    const schnabelImg = document.getElementById('schnabel-img');
    const gridEl = document.getElementById('grid');
    
    let isMoving = false;
    let walkStep = 1;
    let walkInterval = null;
    
    // Grid-Koordinaten: X(1-3), Y(1-4). Y=0.5 ist direkt am oberen Rand von Feld 1
    let currentGridPos = { x: 1, y: 0.5 }; 

    function initGame() {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        
        setTimeout(() => {
            const startCoords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
            updateSchnabelVisuals(startCoords.x, startCoords.y);
        }, 50);
    }

    function getPixelCoordsFromGrid(gX, gY) {
        const rect = gridEl.getBoundingClientRect();
        const container = document.getElementById('game-container').getBoundingClientRect();
        
        const cellWidth = rect.width / 3;
        const cellHeight = rect.height / 4;

        const pxX = (rect.left - container.left) + (gX - 0.5) * cellWidth;
        const pxY = (rect.top - container.top) + (gY - 0.5) * cellHeight;
        
        return { x: pxX, y: pxY };
    }

    function updateSchnabelVisuals(pxX, pxY) {
        const topY = getPixelCoordsFromGrid(1, 0).y;
        const bottomY = getPixelCoordsFromGrid(1, 4.5).y;
        
        let progress = (pxY - topY) / (bottomY - topY);
        progress = Math.max(0, Math.min(1, progress)); 
        
        const scale = 0.40 + (progress * 0.60); 

        schnabel.style.left = (pxX - 60) + 'px'; 
        schnabel.style.top = (pxY - schnabel.offsetHeight) + 'px'; 
        schnabel.style.transform = `scale(${scale})`;
        
        return scale; // Wir geben die Scale zurück, um sie für die Laufgeschwindigkeit zu nutzen
    }

    // --- Lauf-Animation ---
    function startWalkAnimation(fromX, fromY, toX, toY) {
        clearInterval(walkInterval);
        
        let direction = "";
        let dx = toX - fromX;
        let dy = toY - fromY;

        // Logik anhand deiner Vorgaben
        if (Math.abs(dx) < 1) { 
            // Streng vertikal
            if (dy < 0) direction = "zurück_rechts"; // Nach oben
            else direction = "rechts";               // Nach unten
        } else if (dx < 0) {
            // Nach links (inkl. schräg links)
            if (dy < 0) direction = "zurück_links";  // Schräg oben links
            else direction = "links";                // Schräg unten links oder exakt links
        } else {
            // Nach rechts (inkl. schräg rechts)
            if (dy < 0) direction = "zurück_rechts"; // Schräg oben rechts
            else direction = "rechts";               // Schräg unten rechts oder exakt rechts
        }

        // Sofort loslegen!
        walkStep = 1;
        schnabelImg.src = `Schnabel_laufend_${direction}_${walkStep}.png`;

        walkInterval = setInterval(() => {
            walkStep = walkStep === 1 ? 2 : 1;
            schnabelImg.src = `Schnabel_laufend_${direction}_${walkStep}.png`;
        }, 180); // Deutlich verlangsamt für ruhigeren Sprite-Wechsel
    }

    function stopWalkAnimation() {
        clearInterval(walkInterval);
        schnabelImg.src = 'Schnabel_stehend.png';
        walkStep = 1;
    }

    // --- Bewegungsschleife (Direkter Weg) ---
    function moveToTarget(targetX, targetY) {
        const startCoords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
        const targetCoords = getPixelCoordsFromGrid(targetX, targetY);

        startWalkAnimation(startCoords.x, startCoords.y, targetCoords.x, targetCoords.y);

        const startX = startCoords.x;
        const startY = startCoords.y;
        
        // Pixel-Distanz berechnen
        const distance = Math.sqrt(Math.pow(targetCoords.x - startX, 2) + Math.pow(targetCoords.y - startY, 2));
        
        // Perspektivische Geschwindigkeit: 
        // Wir nehmen die durchschnittliche Skalierung auf dem Weg. 
        // Ist die Skalierung klein (hinten), wird die Dauer länger!
        const startScale = updateSchnabelVisuals(startX, startY);
        const endScale = updateSchnabelVisuals(targetCoords.x, targetCoords.y);
        const avgScale = (startScale + endScale) / 2;
        
        // Basis-Geschwindigkeit geteilt durch Scale. 
        // distance * 6 ist der Basiswert. Im Hintergrund (Scale 0.4) dauert es 2.5x so lang wie vorne!
        const duration = (distance * 6) / avgScale; 
        
        let startTime = null;

        function animate(time) {
            if (!startTime) startTime = time;
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / duration, 1);

            const currentPxX = startX + (targetCoords.x - startX) * progress;
            const currentPxY = startY + (targetCoords.y - startY) * progress;

            updateSchnabelVisuals(currentPxX, currentPxY);

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                currentGridPos.x = targetX;
                currentGridPos.y = targetY;
                isMoving = false;
                stopWalkAnimation();
                console.log("Am Ziel angekommen!");
                // HIER KOMMT DIE BUDDEL-ANIMATION HIN
            }
        }
        requestAnimationFrame(animate);
    }

    // Klick-Ereignisse
    fields.forEach(field => {
        field.addEventListener('click', (e) => {
            if (isMoving) return;

            const tX = parseInt(e.target.dataset.x);
            const tY = parseInt(e.target.dataset.y);

            if(tX === currentGridPos.x && tY === currentGridPos.y) return;

            isMoving = true;
            moveToTarget(tX, tY); // Kein Array/Pfad mehr nötig, direkter Flug!
        });
    });
</script>

</body>
</html>
