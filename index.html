<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buddel rum! (v0.10)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #e5b85c; 
        }
        
        /* --- Ladebildschirm --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #e5b85c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #5a3d17;
        }

        #loading-screen h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #fff;
        }

        .progress-bar-container {
            width: 70%;
            max-width: 300px;
            height: 25px;
            border: 3px solid #5a3d17;
            background-color: #d4a351;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #8b5a2b;
            transition: width 0.3s ease;
        }

        /* --- Spielbereich --- */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh; 
            max-width: 600px;
            margin: 0 auto;
            background-image: url('Hintergrund.png');
            background-size: cover;
            background-position: center 80%; 
            overflow: hidden;
            display: none; 
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 84%;
            height: 50%; 
            position: absolute;
            top: 35%; 
            left: 8%;
            z-index: 10;
        }

        .field {
            /* border: 1px solid rgba(0,0,0,0.1); */
            position: relative;
            cursor: pointer;
            pointer-events: auto;
        }

        /* --- Das Loch: Gespiegelt & Korrigierte Position --- */
        .loch-img {
            position: absolute;
            bottom: 25%; /* Wieder etwas weiter nach unten geschoben */
            left: 50%;
            transform: translateX(-50%) scaleX(-1); /* Zentriert und Haufen nach links gespiegelt */
            width: 70%; 
            pointer-events: none;
            z-index: 5;
        }

        /* --- 1. DER ANKERPUNKT --- */
        #schnabel {
            position: absolute;
            width: 0;
            height: 0;
            z-index: 20;
            pointer-events: none;
        }

        /* --- 2. DER SKALIERUNGS-WRAPPER --- */
        #schnabel-scale-wrapper {
            position: absolute;
            bottom: 0; 
            left: 0;
            transform-origin: bottom center;
            /* Nur die Skalierung passiert hier durch JS, keine Verschiebungen! */
        }

        /* --- 3. DAS BILD (Perfekt zentriert) --- */
        #schnabel-img {
            position: absolute;
            bottom: 0;
            /* Zentriert das Bild exakt auf dem 0-Punkt des Wrappers */
            transform: translateX(-50%); 
            width: 120px;
            height: auto;
            display: block;
        }

        /* --- Walking Smoothness: Frame-genaue Mikro-Korrekturen --- 
           Wenn Schnabel in einem bestimmten Frame "zuckt", gleichen wir hier den Schwerpunkt aus. */
           
        /* Links laufen ausgleichen */
        #schnabel[data-direction="links"][data-step="1"] #schnabel-img { transform: translateX(-48%); }
        #schnabel[data-direction="links"][data-step="2"] #schnabel-img { transform: translateX(-52%); }
        
        /* Rechts laufen ausgleichen */
        #schnabel[data-direction="rechts"][data-step="1"] #schnabel-img { transform: translateX(-52%); }
        #schnabel[data-direction="rechts"][data-step="2"] #schnabel-img { transform: translateX(-48%); }

        /* Zurück Links laufen ausgleichen */
        #schnabel[data-direction="zurück_links"][data-step="1"] #schnabel-img { transform: translateX(-49%); }
        #schnabel[data-direction="zurück_links"][data-step="2"] #schnabel-img { transform: translateX(-51%); }
        
        /* Zurück Rechts war laut dir schon smooth, bleibt exakt bei -50% */
        #schnabel[data-direction="zurück_rechts"][data-step="1"] #schnabel-img { transform: translateX(-50%); }
        #schnabel[data-direction="zurück_rechts"][data-step="2"] #schnabel-img { transform: translateX(-50%); }

        /* --- UI Elemente --- */
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 30;
        }

        #btn-buddeln {
            font-family: 'Comic Sans MS', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background-color: #8b5a2b;
            border: 4px solid #5a3d17;
            border-radius: 15px;
            padding: 10px 40px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-shadow: 2px 2px 0px #5a3d17;
            transition: all 0.2s ease;
        }

        #btn-buddeln:active:not(:disabled) {
            transform: scale(0.95);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }

        #btn-buddeln:disabled {
            background-color: #b09a83;
            border-color: #8c7b69;
            color: #e0d6cb;
            cursor: not-allowed;
            text-shadow: none;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <h1>Expedition startet...</h1>
    <div class="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
</div>

<div id="game-container">
    <div id="grid">
        <div class="field" data-index="1" data-x="1" data-y="1"></div>
        <div class="field" data-index="2" data-x="2" data-y="1"></div>
        <div class="field" data-index="3" data-x="3" data-y="1"></div>
        <div class="field" data-index="4" data-x="1" data-y="2"></div>
        <div class="field" data-index="5" data-x="2" data-y="2"></div>
        <div class="field" data-index="6" data-x="3" data-y="2"></div>
        <div class="field" data-index="7" data-x="1" data-y="3"></div>
        <div class="field" data-index="8" data-x="2" data-y="3"></div>
        <div class="field" data-index="9" data-x="3" data-y="3"></div>
        <div class="field" data-index="10" data-x="1" data-y="4"></div>
        <div class="field" data-index="11" data-x="2" data-y="4"></div>
        <div class="field" data-index="12" data-x="3" data-y="4"></div>
    </div>

    <div id="schnabel" data-direction="" data-step="1">
        <div id="schnabel-scale-wrapper">
            <img id="schnabel-img" src="Schnabel_stehend.png" alt="Schnabel">
        </div>
    </div>

    <div id="ui-layer">
        <button id="btn-buddeln" disabled>Buddeln</button>
    </div>
</div>

<script>
    const imagesToLoad = [
        'Hintergrund.png', 'Schnabel_stehend.png',
        'Schnabel_laufend_links_1.png', 'Schnabel_laufend_links_2.png',
        'Schnabel_laufend_rechts_1.png', 'Schnabel_laufend_rechts_2.png',
        'Schnabel_laufend_zurück_links_1.png', 'Schnabel_laufend_zurück_links_2.png',
        'Schnabel_laufend_zurück_rechts_1.png', 'Schnabel_laufend_zurück_rechts_2.png',
        'Schnabel_rauchend_1.png', 'Schnabel_rauchend_2.png',
        'Buddel-Bursche_buddelnd-1.png', 'Buddel-Bursche_buddelnd-2.png',
        'Buddel-Bursche-Hurra.png', 'Loch.png'
    ];
    let loadedImages = 0;

    function imageLoaded() {
        loadedImages++;
        document.getElementById('progress-bar').style.width = (loadedImages / imagesToLoad.length * 100) + '%';
        if (loadedImages === imagesToLoad.length) {
            setTimeout(initGame, 500); 
        }
    }

    imagesToLoad.forEach(src => {
        const img = new Image();
        img.onload = imageLoaded;
        img.onerror = imageLoaded; 
        img.src = src;
    });

    const fields = document.querySelectorAll('.field');
    const schnabel = document.getElementById('schnabel'); 
    const schnabelScaleWrapper = document.getElementById('schnabel-scale-wrapper'); 
    const schnabelImg = document.getElementById('schnabel-img');
    const gridEl = document.getElementById('grid');
    const btnBuddeln = document.getElementById('btn-buddeln');
    
    let isMoving = false;
    let isDigging = false; 
    let walkStep = 1;
    let walkInterval = null;
    let currentDirection = null; 
    
    let currentGridPos = { x: 1, y: 0.5 }; 
    let dugFields = new Set(); 

    let idleTimer = null;
    let smokeInterval = null;
    let digActionInterval = null;

    function initGame() {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        
        setTimeout(() => {
            const startCoords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
            updateSchnabelVisuals(startCoords.x, startCoords.y);
            updateButtonState();
        }, 50);
    }

    function getPixelCoordsFromGrid(gX, gY) {
        const rect = gridEl.getBoundingClientRect();
        const container = document.getElementById('game-container').getBoundingClientRect();
        const cellWidth = rect.width / 3;
        const cellHeight = rect.height / 4;
        const pxX = (rect.left - container.left) + (gX - 0.5) * cellWidth;
        const pxY = (rect.top - container.top) + (gY - 0.5) * cellHeight;
        return { x: pxX, y: pxY };
    }

    function updateSchnabelVisuals(pxX, pxY) {
        const yStart = getPixelCoordsFromGrid(1, 0.5).y;
        const yBottom4 = getPixelCoordsFromGrid(1, 4.0).y;
        
        let progress = (pxY - yStart) / (yBottom4 - yStart);
        progress = Math.max(0, Math.min(1, progress)); 
        
        const scaleBase = 0.50 + (progress * 0.50); 
        let finalScale = scaleBase;

        if (currentDirection && currentDirection.startsWith('zurück_')) {
            finalScale = scaleBase * 0.85; 
        }

        // Anker platzieren
        schnabel.style.left = pxX + 'px'; 
        schnabel.style.top = pxY + 'px'; 
        
        // NUR den Wrapper skalieren, damit translateX(-50%) auf dem Bild erhalten bleibt
        schnabelScaleWrapper.style.transform = `scale(${Math.max(0.1, finalScale)})`; 
        
        return scaleBase; 
    }

    function stopAllTimers() {
        clearTimeout(idleTimer);
        clearInterval(smokeInterval);
        clearInterval(digActionInterval);
    }

    function startIdleTimer() {
        stopAllTimers();
        if (currentGridPos.y === 0.5) return; 

        idleTimer = setTimeout(() => {
            startSmoking();
        }, 3000); 
    }

    function startSmoking() {
        let smokeStep = 1;
        schnabelImg.src = `Schnabel_rauchend_${smokeStep}.png`;

        smokeInterval = setInterval(() => {
            smokeStep = smokeStep === 1 ? 2 : 1;
            schnabel.dataset.step = smokeStep; // Updatet CSS, falls nötig
            schnabelImg.src = `Schnabel_rauchend_${smokeStep}.png`;
        }, 1500); // 1,5 Sekunden
    }

    function updateButtonState() {
        const fieldKey = `${currentGridPos.x}-${currentGridPos.y}`;
        if (!isMoving && !isDigging && currentGridPos.y !== 0.5 && !dugFields.has(fieldKey)) {
            btnBuddeln.disabled = false;
        } else {
            btnBuddeln.disabled = true;
        }
    }

    btnBuddeln.addEventListener('click', () => {
        if (btnBuddeln.disabled) return;
        
        isDigging = true;
        updateButtonState(); 
        stopAllTimers();

        let digStep = 1;
        schnabel.dataset.step = digStep;
        schnabelImg.src = `Buddel-Bursche_buddelnd-${digStep}.png`;
        
        let digTime = 0;
        
        digActionInterval = setInterval(() => {
            digStep = digStep === 1 ? 2 : 1;
            schnabel.dataset.step = digStep;
            schnabelImg.src = `Buddel-Bursche_buddelnd-${digStep}.png`;
            digTime += 500;

            if (digTime >= 4000) {
                clearInterval(digActionInterval);
                finishDigging();
            }
        }, 500);
    });

    function finishDigging() {
        const fieldKey = `${currentGridPos.x}-${currentGridPos.y}`;
        dugFields.add(fieldKey); 
        
        const fieldEl = document.querySelector(`.field[data-x="${currentGridPos.x}"][data-y="${currentGridPos.y}"]`);
        const lochImg = document.createElement('img');
        lochImg.src = 'Loch.png';
        lochImg.className = 'loch-img';
        fieldEl.appendChild(lochImg);

        schnabelImg.src = 'Buddel-Bursche-Hurra.png';

        setTimeout(() => {
            schnabelImg.src = 'Schnabel_stehend.png';
            schnabel.dataset.direction = ""; // Reset
            schnabel.dataset.step = "1";
            isDigging = false;
            updateButtonState();
            startIdleTimer(); 
        }, 3000);
    }

    function startWalkAnimation(fromX, fromY, toX, toY) {
        clearInterval(walkInterval);
        
        currentDirection = "";
        let dx = toX - fromX;
        let dy = toY - fromY;

        if (Math.abs(dx) < 1) { 
            if (dy < 0) currentDirection = "zurück_rechts"; 
            else currentDirection = "rechts";               
        } else if (dx < 0) {
            if (dy < 0) currentDirection = "zurück_links";  
            else currentDirection = "links";                
        } else {
            if (dy < 0) currentDirection = "zurück_rechts"; 
            else currentDirection = "rechts";               
        }

        schnabel.dataset.direction = currentDirection;

        walkStep = 1;
        schnabel.dataset.step = walkStep; // Triggert CSS-Korrektur
        schnabelImg.src = `Schnabel_laufend_${currentDirection}_${walkStep}.png`;

        walkInterval = setInterval(() => {
            walkStep = walkStep === 1 ? 2 : 1;
            schnabel.dataset.step = walkStep; // Triggert die Gegenseite im CSS
            schnabelImg.src = `Schnabel_laufend_${currentDirection}_${walkStep}.png`;
        }, 180); 
    }

    function stopWalkAnimation() {
        clearInterval(walkInterval);
        schnabelImg.src = 'Schnabel_stehend.png';
        walkStep = 1;
        currentDirection = null; 
        schnabel.dataset.direction = ""; 
        schnabel.dataset.step = "1";
    }

    function moveToTarget(targetX, targetY) {
        stopAllTimers(); 
        updateButtonState();

        const startCoords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
        const targetCoords = getPixelCoordsFromGrid(targetX, targetY);

        startWalkAnimation(startCoords.x, startCoords.y, targetCoords.x, targetCoords.y);

        const startX = startCoords.x;
        const startY = startCoords.y;
        const distance = Math.sqrt(Math.pow(targetCoords.x - startX, 2) + Math.pow(targetCoords.y - startY, 2));
        
        const startScaleBase = updateSchnabelVisuals(startX, startY);
        const endScaleBase = updateSchnabelVisuals(targetCoords.x, targetCoords.y);
        const avgScaleBase = (startScaleBase + endScaleBase) / 2;
        const duration = (distance * 6) / avgScaleBase; 
        
        let startTime = null;

        function animate(time) {
            if (!startTime) startTime = time;
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / duration, 1);

            const currentPxX = startX + (targetCoords.x - startX) * progress;
            const currentPxY = startY + (targetCoords.y - startY) * progress;

            updateSchnabelVisuals(currentPxX, currentPxY);

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                currentGridPos.x = targetX;
                currentGridPos.y = targetY;
                isMoving = false;
                stopWalkAnimation();
                
                const finalCoords = getPixelCoordsFromGrid(targetX, targetY);
                updateSchnabelVisuals(finalCoords.x, finalCoords.y);
                
                updateButtonState();
                startIdleTimer();
            }
        }
        requestAnimationFrame(animate);
    }

    fields.forEach(field => {
        field.addEventListener('click', (e) => {
            if (isMoving || isDigging) return;

            const tX = parseInt(e.target.dataset.x);
            const tY = parseInt(e.target.dataset.y);

            if(tX === currentGridPos.x && tY === currentGridPos.y) return;

            isMoving = true;
            moveToTarget(tX, tY); 
        });
    });
</script>

</body>
</html>
