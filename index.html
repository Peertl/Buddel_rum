<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buddel rum! (v0.27)</title>
    <style>
        /* Deaktiviert den blauen Klick-Schein auf mobilen Geräten */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #e5b85c; 
        }
        
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #e5b85c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #5a3d17;
        }

        #loading-screen h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #fff;
        }

        .progress-bar-container {
            width: 70%;
            max-width: 300px;
            height: 25px;
            border: 3px solid #5a3d17;
            background-color: #d4a351;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #8b5a2b;
            transition: width 0.3s ease;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh; 
            max-width: 600px;
            margin: 0 auto;
            background-image: url('Hintergrund.png');
            background-size: cover;
            background-position: center 80%; 
            overflow: hidden;
            display: none; 
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 84%;
            height: 50%; 
            position: absolute;
            top: 35%; 
            left: 8%;
            z-index: 10;
        }

        .field {
            position: relative;
            cursor: pointer;
            pointer-events: auto;
        }

        /* --- Das Rote Markierungskreuz (Perspektivisch flach) --- */
        .tap-x {
            position: absolute;
            color: #b22222; /* Dunkelrot */
            font-size: 3rem;
            font-weight: 900;
            pointer-events: none;
            z-index: 999;
            /* rotateX(60deg) kippt das X nach hinten, sodass es flach auf dem Boden liegt! */
            animation: fadeX 0.5s ease-out forwards;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
            font-family: Arial, sans-serif;
        }

        @keyframes fadeX {
            0% { opacity: 1; transform: translate(-50%, -50%) rotateX(60deg) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -50%) rotateX(60deg) scale(1.3); }
        }

        .loch-img {
            position: absolute;
            bottom: 25%; 
            left: 50%;
            width: 110px; 
            transform-origin: bottom center;
            pointer-events: none;
            z-index: 5;
        }

        #schnabel {
            position: absolute;
            width: 0;
            height: 0;
            z-index: 20;
            pointer-events: none;
            --shift-x: -50%;
            --shift-y: 0%;
            --scale-correction: 1;
        }

        #schnabel-scale-wrapper {
            position: absolute;
            bottom: 0; 
            left: 0;
            transform-origin: bottom center;
        }

        #schnabel-img {
            position: absolute;
            bottom: 0;
            height: 180px; 
            width: auto;
            transform: translate(var(--shift-x), var(--shift-y)) scale(var(--scale-correction)); 
            transform-origin: bottom center;
            display: block;
        }

        /* CSS-PERFEKTIONS-KORREKTUREN */
        #schnabel[data-sprite="stehend"] { --shift-x: -50%; --scale-correction: 1; }
        #schnabel[data-sprite="rauchend_1"] { --shift-x: -50%; --shift-y: 2%; --scale-correction: 1.05; }
        #schnabel[data-sprite="rauchend_2"] { --shift-x: -50.5%; --shift-y: 2%; --scale-correction: 1.05; }
        #schnabel[data-sprite="laufend_links_1"] { --shift-x: -50%; --scale-correction: 1; }
        #schnabel[data-sprite="laufend_links_2"] { --shift-x: -50%; --scale-correction: 1; }
        #schnabel[data-sprite="laufend_rechts_1"] { --shift-x: -50%; --scale-correction: 1; }
        #schnabel[data-sprite="laufend_rechts_2"] { --shift-x: -50%; --scale-correction: 1; }
        #schnabel[data-sprite="laufend_zurück_links_1"] { --shift-x: -50%; --scale-correction: 0.96; }
        #schnabel[data-sprite="laufend_zurück_links_2"] { --shift-x: -50%; --scale-correction: 0.96; }
        #schnabel[data-sprite="laufend_zurück_rechts_1"] { --shift-x: -50%; --scale-correction: 0.96; }
        #schnabel[data-sprite="laufend_zurück_rechts_2"] { --shift-x: -50%; --scale-correction: 0.96; }
        #schnabel[data-sprite="buddelnd_1"] { --shift-x: -50%; --scale-correction: 0.80; }
        #schnabel[data-sprite="buddelnd_2"] { --shift-x: -50%; --scale-correction: 0.80; }
        #schnabel[data-sprite="hurra"] { --shift-x: -50%; --scale-correction: 0.80; }

        /* Overlay Styles */
        .overlay-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #5a3d17;
            text-align: center;
        }

        #result-display, #summary-display {
            background-color: #d4a351;
            border: 8px solid #8b5a2b;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 85%;
            max-height: 90%;
            overflow-y: auto;
        }

        .found-img {
            width: 130px;
            margin-bottom: 15px;
        }

        .quote {
            font-style: italic;
            font-weight: bold;
            margin: 10px 0;
            font-size: 1.1rem;
            min-height: 1.2em; /* Verhindert das Springen des Layouts bei leerem Text */
        }

        .run-btn {
            font-family: 'Comic Sans MS', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background-color: #8b5a2b;
            border: 4px solid #5a3d17;
            border-radius: 15px;
            padding: 10px 40px;
            cursor: pointer;
            margin-top: 15px;
            text-shadow: 2px 2px 0px #5a3d17;
        }

        /* Summary List */
        #finds-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            width: 100%;
        }

        #finds-list li {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .list-icon {
            width: 50px;
            margin-right: 15px;
        }

        /* Total Summary */
        .summary-header {
            display: flex;
            align-items: center;
            margin-top: 20px;
            border-top: 3px dashed #8b5a2b;
            padding-top: 20px;
        }

        .total-currency-img {
            width: 70px;
            margin-right: 15px;
        }

        .summary-title {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .total-amount-text {
            font-size: 2rem;
            font-weight: 900;
            margin-top: 5px;
        }

        /* UI elements */
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 30;
        }

        #btn-buddeln {
            font-family: 'Comic Sans MS', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background-color: #8b5a2b;
            border: 4px solid #5a3d17;
            border-radius: 15px;
            padding: 10px 40px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-shadow: 2px 2px 0px #5a3d17;
        }

        #btn-buddeln:disabled {
            background-color: #b09a83;
            border-color: #8c7b69;
            color: #e0d6cb;
            cursor: not-allowed;
            text-shadow: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <h1>Expedition startet...</h1>
    <div class="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
</div>

<div id="game-container">
    <div id="grid">
        <div class="field" data-index="1" data-x="1" data-y="1"></div>
        <div class="field" data-index="2" data-x="2" data-y="1"></div>
        <div class="field" data-index="3" data-x="3" data-y="1"></div>
        <div class="field" data-index="4" data-x="1" data-y="2"></div>
        <div class="field" data-index="5" data-x="2" data-y="2"></div>
        <div class="field" data-index="6" data-x="3" data-y="2"></div>
        <div class="field" data-index="7" data-x="1" data-y="3"></div>
        <div class="field" data-index="8" data-x="2" data-y="3"></div>
        <div class="field" data-index="9" data-x="3" data-y="3"></div>
        <div class="field" data-index="10" data-x="1" data-y="4"></div>
        <div class="field" data-index="11" data-x="2" data-y="4"></div>
        <div class="field" data-index="12" data-x="3" data-y="4"></div>
    </div>

    <div id="schnabel" data-sprite="stehend">
        <div id="schnabel-scale-wrapper">
            <img id="schnabel-img" src="Schnabel_stehend.png" alt="Schnabel">
        </div>
    </div>

    <div id="ui-layer">
        <button id="btn-buddeln" disabled>Buddeln</button>
    </div>

    <div id="result-layer" class="overlay-layer">
        <div id="result-display">
            <img id="found-item-img" class="found-img" src="Niete.png" alt="Fundstück">
            <p id="found-quote" class="quote"></p>
            <button id="confirm-find-btn" class="run-btn">un!</button>
        </div>
    </div>

    <div id="summary-layer" class="overlay-layer">
        <div id="summary-display">
            <h2 style="margin-top:0; font-size: 2rem;">Expedition beendet!</h2>
            
            <ul id="finds-list">
                </ul>
            
            <div class="summary-header">
                <img src="Währung.png" class="total-currency-img" alt="Rolle Geld">
                <span class="summary-title">Verdientes Geld:</span>
            </div>
            <div id="final-sum-text" class="total-amount-text">0 Rollen</div>
            
            <button id="restart-btn" class="run-btn" style="background-color: #5a3d17; margin-top: 30px;">Neue Expedition starten</button>
        </div>
    </div>
</div>

<script>
    const imagesToLoad = [
        'Hintergrund.png', 'Schnabel_stehend.png',
        'Schnabel_laufend_links_1.png', 'Schnabel_laufend_links_2.png',
        'Schnabel_laufend_rechts_1.png', 'Schnabel_laufend_rechts_2.png',
        'Schnabel_laufend_zurück_links_1.png', 'Schnabel_laufend_zurück_links_2.png',
        'Schnabel_laufend_zurück_rechts_1.png', 'Schnabel_laufend_zurück_rechts_2.png',
        'Schnabel_rauchend_1.png', 'Schnabel_rauchend_2.png',
        'Buddel-Bursche_buddelnd-1.png', 'Buddel-Bursche_buddelnd-2.png',
        'Buddel-Bursche-Hurra.png', 'Loch.png',
        'Währung.png', 'Kanope_Anubis_Stil-1.png', 'Niete.png'
    ];
    let loadedImages = 0;

    // Item-Datenbank (Werte & Sprüche)
    const findItems = {
        'niete': { img: 'Niete.png', text: '', value: 0 },
        'kanope': { img: 'Kanope_Anubis_Stil-1.png', text: '"Die wird mir eine schöne Rolle Geld einbringen!"', value: 1 }
    };

    const fields = document.querySelectorAll('.field');
    const schnabel = document.getElementById('schnabel'); 
    const schnabelScaleWrapper = document.getElementById('schnabel-scale-wrapper'); 
    const schnabelImg = document.getElementById('schnabel-img');
    const gridEl = document.getElementById('grid');
    const gameContainer = document.getElementById('game-container');
    const btnBuddeln = document.getElementById('btn-buddeln');
    
    // Result Layer
    const resultLayer = document.getElementById('result-layer');
    const foundItemImg = document.getElementById('found-item-img');
    const foundQuote = document.getElementById('found-quote');
    const confirmFindBtn = document.getElementById('confirm-find-btn');
    
    // Summary Layer
    const summaryLayer = document.getElementById('summary-layer');
    const findsList = document.getElementById('finds-list');
    const finalSumText = document.getElementById('final-sum-text');
    const restartBtn = document.getElementById('restart-btn');

    let isMoving = false;
    let isDigging = false; 
    let showingResult = false;
    let walkStep = 1;
    let walkInterval = null;
    let currentDirection = null; 
    
    let currentGridPos = { x: 1, y: 0.5 }; 
    let dugFields = new Set(); 
    let inventory = [];
    let gameItems = []; // Speichert die verdeckten Items

    let idleTimer = null;
    let smokeInterval = null;
    let digActionInterval = null;

    function imageLoaded() {
        loadedImages++;
        document.getElementById('progress-bar').style.width = (loadedImages / imagesToLoad.length * 100) + '%';
        if (loadedImages === imagesToLoad.length) {
            setTimeout(initGame, 500); 
        }
    }

    imagesToLoad.forEach(src => {
        const img = new Image();
        img.onload = imageLoaded;
        img.onerror = imageLoaded; 
        img.src = src;
    });

    function setSchnabelImage(filename, spriteState) {
        schnabelImg.src = filename;
        schnabel.dataset.sprite = spriteState;
    }

    function initGame() {
        document.getElementById('loading-screen').style.display = 'none';
        gameContainer.style.display = 'block';
        resetGame();
    }

    function resetGame() {
        resultLayer.style.display = 'none';
        summaryLayer.style.display = 'none';
        btnBuddeln.style.display = 'block';
        
        inventory = [];
        dugFields.clear();
        document.querySelectorAll('.loch-img').forEach(img => img.remove());
        
        // 4 Nieten, 8 Kanopen -> Zufällig mischen
        gameItems = Array(4).fill('niete').concat(Array(8).fill('kanope'));
        gameItems.sort(() => Math.random() - 0.5); 
        
        currentGridPos = { x: 1, y: 0.5 };
        isDigging = false; 
        isMoving = false; 
        showingResult = false;
        
        setSchnabelImage('Schnabel_stehend.png', 'stehend');
        stopAllTimers();
        
        const coords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
        updateSchnabelVisuals(coords.x, coords.y);
        updateButtonState();
    }

    function getPixelCoordsFromGrid(gX, gY) {
        const rect = gridEl.getBoundingClientRect();
        const container = gameContainer.getBoundingClientRect();
        const cellWidth = rect.width / 3;
        const cellHeight = rect.height / 4;
        const pxX = (rect.left - container.left) + (gX - 0.5) * cellWidth;
        const pxY = (rect.top - container.top) + (gY - 0.5) * cellHeight;
        return { x: pxX, y: pxY };
    }

    function updateSchnabelVisuals(pxX, pxY) {
        const yStart = getPixelCoordsFromGrid(1, 0.5).y;
        const yBottom4 = getPixelCoordsFromGrid(1, 4.0).y;
        let progress = (pxY - yStart) / (yBottom4 - yStart);
        progress = Math.max(0, Math.min(1, progress)); 
        const finalScale = 0.50 + (progress * 0.50); 
        schnabel.style.left = pxX + 'px'; 
        schnabel.style.top = pxY + 'px'; 
        schnabelScaleWrapper.style.transform = `scale(${Math.max(0.1, finalScale)})`; 
        return finalScale; 
    }

    function stopAllTimers() {
        clearTimeout(idleTimer);
        clearInterval(smokeInterval);
        clearInterval(digActionInterval);
    }

    function startIdleTimer() {
        stopAllTimers();
        if (currentGridPos.y === 0.5 || showingResult) return; 

        idleTimer = setTimeout(() => {
            let smokeStep = 1;
            setSchnabelImage(`Schnabel_rauchend_${smokeStep}.png`, `rauchend_${smokeStep}`);
            smokeInterval = setInterval(() => {
                smokeStep = smokeStep === 1 ? 2 : 1;
                setSchnabelImage(`Schnabel_rauchend_${smokeStep}.png`, `rauchend_${smokeStep}`);
            }, 1500); 
        }, 3000); 
    }

    function updateButtonState() {
        const fieldKey = `${currentGridPos.x}-${currentGridPos.y}`;
        if (!isMoving && !isDigging && !showingResult && currentGridPos.y !== 0.5 && !dugFields.has(fieldKey) && dugFields.size < 3) {
            btnBuddeln.disabled = false;
        } else {
            btnBuddeln.disabled = true;
        }
    }

    btnBuddeln.addEventListener('click', () => {
        if (btnBuddeln.disabled) return;
        
        isDigging = true;
        updateButtonState(); 
        stopAllTimers();

        let digStep = 1;
        setSchnabelImage(`Buddel-Bursche_buddelnd-${digStep}.png`, `buddelnd_${digStep}`);
        let digTime = 0;
        
        digActionInterval = setInterval(() => {
            digStep = digStep === 1 ? 2 : 1;
            setSchnabelImage(`Buddel-Bursche_buddelnd-${digStep}.png`, `buddelnd_${digStep}`);
            digTime += 500;

            if (digTime >= 4000) {
                clearInterval(digActionInterval);
                finishDigging();
            }
        }, 500);
    });

    function finishDigging() {
        const fieldEl = document.querySelector(`.field[data-x="${currentGridPos.x}"][data-y="${currentGridPos.y}"]`);
        const fieldIndex = parseInt(fieldEl.dataset.index);
        
        dugFields.add(`${currentGridPos.x}-${currentGridPos.y}`); 
        
        const coords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
        const currentScale = updateSchnabelVisuals(coords.x, coords.y);

        const lochImg = document.createElement('img');
        lochImg.src = 'Loch.png';
        lochImg.className = 'loch-img';
        lochImg.style.transform = `translateX(-50%) scaleX(-${currentScale}) scaleY(${currentScale})`;
        fieldEl.appendChild(lochImg);

        setSchnabelImage('Buddel-Bursche-Hurra.png', 'hurra');
        showingResult = true;
        updateButtonState();

        const itemKey = gameItems[fieldIndex - 1];
        const item = findItems[itemKey];
        inventory.push(itemKey);

        foundItemImg.src = item.img;
        foundQuote.innerText = item.text;
        resultLayer.style.display = 'flex'; 
    }

    confirmFindBtn.addEventListener('click', () => {
        resultLayer.style.display = 'none';
        showingResult = false;
        isDigging = false;
        
        if (dugFields.size >= 3) {
            showSummary();
        } else {
            setSchnabelImage('Schnabel_stehend.png', 'stehend');
            updateButtonState();
            startIdleTimer();
        }
    });

    function showSummary() {
        findsList.innerHTML = ''; 
        let total = 0;
        
        inventory.forEach((key) => {
            const item = findItems[key];
            total += item.value;
            
            const li = document.createElement('li');
            const rollText = item.value === 1 ? "1 Rolle" : `${item.value} Rollen`;
            li.innerHTML = `<img src="${item.img}" class="list-icon"> <span>${rollText}</span>`;
            findsList.appendChild(li);
        });

        finalSumText.innerText = total === 1 ? "1 Rolle" : `${total} Rollen`;
        
        btnBuddeln.style.display = 'none';
        summaryLayer.style.display = 'flex'; 
    }

    restartBtn.addEventListener('click', resetGame);

    function startWalkAnimation(fromX, fromY, toX, toY) {
        clearInterval(walkInterval);
        
        currentDirection = "";
        let dx = toX - fromX;
        let dy = toY - fromY;

        if (Math.abs(dx) < 1) { 
            if (dy < 0) currentDirection = "zurück_rechts"; 
            else currentDirection = "rechts";               
        } else if (dx < 0) {
            if (dy < 0) currentDirection = "zurück_links";  
            else currentDirection = "links";                
        } else {
            if (dy < 0) currentDirection = "zurück_rechts"; 
            else currentDirection = "rechts";               
        }

        walkStep = 1;
        setSchnabelImage(`Schnabel_laufend_${currentDirection}_${walkStep}.png`, `laufend_${currentDirection}_${walkStep}`);

        walkInterval = setInterval(() => {
            walkStep = walkStep === 1 ? 2 : 1;
            setSchnabelImage(`Schnabel_laufend_${currentDirection}_${walkStep}.png`, `laufend_${currentDirection}_${walkStep}`);
        }, 180); 
    }

    function stopWalkAnimation() {
        clearInterval(walkInterval);
        setSchnabelImage('Schnabel_stehend.png', 'stehend');
        walkStep = 1;
        currentDirection = null; 
    }

    function moveToTarget(targetX, targetY) {
        stopAllTimers(); 
        updateButtonState();

        const startCoords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
        const targetCoords = getPixelCoordsFromGrid(targetX, targetY);

        startWalkAnimation(startCoords.x, startCoords.y, targetCoords.x, targetCoords.y);

        const dist = Math.sqrt(Math.pow(targetCoords.x - startCoords.x, 2) + Math.pow(targetCoords.y - startCoords.y, 2));
        const avgScaleBase = (updateSchnabelVisuals(startCoords.x, startCoords.y) + updateSchnabelVisuals(targetCoords.x, targetCoords.y)) / 2;
        const duration = (dist * 6) / avgScaleBase; 
        
        let startTime = null;

        function animate(time) {
            if (!startTime) startTime = time;
            const progress = Math.min((time - startTime) / duration, 1);

            updateSchnabelVisuals(
                startCoords.x + (targetCoords.x - startCoords.x) * progress, 
                startCoords.y + (targetCoords.y - startCoords.y) * progress
            );

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                currentGridPos.x = targetX;
                currentGridPos.y = targetY;
                isMoving = false;
                stopWalkAnimation();
                
                const finalCoords = getPixelCoordsFromGrid(targetX, targetY);
                updateSchnabelVisuals(finalCoords.x, finalCoords.y);
                
                updateButtonState();
                startIdleTimer();
            }
        }
        requestAnimationFrame(animate);
    }

    // Klick-Logik auf die Felder (inklusive Tap-X Markierung)
    fields.forEach(field => {
        field.addEventListener('click', (e) => {
            // Das X generieren
            const xMark = document.createElement('div');
            xMark.innerText = 'X';
            xMark.className = 'tap-x';
            
            const rect = gameContainer.getBoundingClientRect();
            // Koordinaten je nach Maus oder Touch
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            
            xMark.style.left = (clientX - rect.left) + 'px';
            xMark.style.top = (clientY - rect.top) + 'px';
            gameContainer.appendChild(xMark);
            
            setTimeout(() => xMark.remove(), 500);

            // Verhindern, dass man läuft, während man buddelt oder Schätze ansieht
            if (isMoving || isDigging || showingResult || dugFields.size >= 3) return;

            const tX = parseInt(e.target.dataset.x);
            const tY = parseInt(e.target.dataset.y);

            // Verhindern, dass man auf der Stelle läuft
            if(tX === currentGridPos.x && tY === currentGridPos.y) return;

            isMoving = true;
            moveToTarget(tX, tY); 
        });
    });
</script>
