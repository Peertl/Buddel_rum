<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buddel rum! (v0.37)</title>
    <style>
        /* Deaktiviert den blauen Klick-Schein auf mobilen Geräten */
        * { -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Comic Sans MS', sans-serif;
            background-color: #e5b85c; 
        }
        
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #e5b85c; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; color: #5a3d17;
        }

        .progress-bar-container {
            width: 70%; max-width: 300px; height: 25px;
            border: 3px solid #5a3d17; background-color: #d4a351;
            border-radius: 12px; overflow: hidden; position: relative;
        }

        #progress-bar { width: 0%; height: 100%; background-color: #8b5a2b; transition: width 0.3s ease; }

        #game-container {
            position: relative; width: 100vw; height: 100dvh; max-width: 600px;
            margin: 0 auto; background-image: url('Hintergrund.png');
            background-size: cover; background-position: center 80%; 
            overflow: hidden; display: none; 
        }

        #grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 84%; height: 50%; position: absolute;
            top: 35%; left: 8%; z-index: 10;
        }

        .field { position: relative; cursor: pointer; pointer-events: auto; }

        /* PERSPEKTIVISCHES X-MARKERUNG */
        .tap-x {
            position: absolute; color: #b22222; font-size: 3rem;
            font-weight: 900; pointer-events: none; transform: translate(-50%, -50%);
            z-index: 999; animation: fadeX 0.5s ease-out forwards;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            font-family: Arial, sans-serif;
        }

        @keyframes fadeX {
            0% { opacity: 1; transform: translate(-50%, -50%) rotateX(60deg) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -50%) rotateX(60deg) scale(1.3); }
        }

        /* EBENEN-LOGIK & POSITION DES LOCHS */
        .loch-img {
            position: absolute; 
            left: 45%;   
            width: 90px; 
            transform-origin: bottom center;
            pointer-events: none; 
            z-index: 15; 
        }
        .loch-img.latest-dug {
            z-index: 25; 
        }

        #schnabel { position: absolute; width: 0; height: 0; z-index: 20; pointer-events: none; --shift-x: -50%; --shift-y: 0%; --scale-correction: 1; }
        #schnabel-scale-wrapper { position: absolute; bottom: 0; left: 0; transform-origin: bottom center; }
        #schnabel-img {
            position: absolute; bottom: 0; height: 180px; width: auto;
            transform: translate(var(--shift-x), var(--shift-y)) scale(var(--scale-correction)); 
            transform-origin: bottom center; display: block;
        }

        /* Sprite Fixes & Poses */
        #schnabel[data-sprite="stehend"] { --shift-x: -50%; --scale-correction: 1; }
        #schnabel[data-sprite="rauchend_1"] { --shift-x: -50%; --shift-y: 2%; --scale-correction: 1.05; }
        #schnabel[data-sprite="rauchend_2"] { --shift-x: -50.5%; --shift-y: 2%; --scale-correction: 1.05; }
        #schnabel[data-sprite^="laufend"] { --shift-x: -50%; --scale-correction: 1; }
        #schnabel[data-sprite^="laufend_zurück"] { --scale-correction: 0.96; }
        #schnabel[data-sprite^="buddelnd"], #schnabel[data-sprite="hurra"] { --scale-correction: 0.80; }
        #schnabel[data-sprite="kritzelnd"], #schnabel[data-sprite="haltend"] { --scale-correction: 0.80; }

        /* Overlay Styles */
        .overlay-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); z-index: 100;
            display: none; justify-content: center; align-items: center;
            flex-direction: column; color: #5a3d17; text-align: center;
        }

        /* RESULT DISPLAY (Größer) */
        #result-display {
            background-color: #d4a351; border: 8px solid #8b5a2b;
            border-radius: 20px; padding: 30px 20px; display: flex;
            flex-direction: column; align-items: center; justify-content: space-between;
            position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 85vw; max-width: 400px; /* Fenster breiter machen */
            min-height: 380px; /* Fenster höher machen */
        }

        .found-img { 
            height: 220px; /* Bild von 140px auf 220px vergrößert! */
            max-height: 40vh; /* Verhindert Abschneiden auf sehr kleinen Displays */
            width: auto; 
            max-width: 100%;
            object-fit: contain;
        }
        
        .quote { 
            font-style: italic; font-weight: bold; margin: 15px 0 10px 0; 
            font-size: 1.25rem; /* Schrift etwas größer */
            min-height: 3em; display: flex; align-items: center; justify-content: center; 
        }

        .run-btn {
            font-family: 'Comic Sans MS', sans-serif; font-size: 1.5rem;
            font-weight: bold; color: #fff; background-color: #8b5a2b;
            border: 4px solid #5a3d17; border-radius: 15px;
            padding: 8px 40px; cursor: pointer; margin-top: auto;
            text-shadow: 2px 2px 0px #5a3d17;
        }

        /* SUMMARY DISPLAY (Größer) */
        #summary-display {
            background-color: #d4a351; border: 8px solid #8b5a2b;
            border-radius: 20px; padding: 30px 25px; display: flex;
            flex-direction: column; align-items: center; position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 90vw; max-width: 450px; /* Breiter */
            max-height: 95%; overflow-y: auto;
        }

        #finds-list { list-style: none; padding: 0; margin: 20px 0; width: 100%; }
        #finds-list li { display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 1.4rem; font-weight: bold;}
        .list-icon { 
            width: 60px; /* Icons von 40px auf 60px vergrößert */
            height: 60px; 
            object-fit: contain; margin-right: 15px; 
        }

        .summary-header { display: flex; align-items: center; margin-top: 15px; border-top: 3px dashed #8b5a2b; padding-top: 20px; }
        .total-currency-img { width: 70px; margin-right: 15px; } /* Geldrolle vergrößert */
        .summary-title { font-size: 1.6rem; font-weight: bold; }
        .total-amount-text { font-size: 2.2rem; font-weight: 900; margin-top: 5px; }

        #restart-btn { font-size: 1.3rem; padding: 12px 25px; margin-top: 25px; white-space: nowrap; background-color: #5a3d17; }

        #btn-buddeln {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-family: 'Comic Sans MS', sans-serif; font-size: 1.5rem;
            font-weight: bold; color: #fff; background-color: #8b5a2b;
            border: 4px solid #5a3d17; border-radius: 15px;
            padding: 10px 40px; cursor: pointer; z-index: 30; text-shadow: 2px 2px 0px #5a3d17;
        }
        #btn-buddeln:disabled { background-color: #b09a83; color: #e0d6cb; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="loading-screen">
    <h1>Expedition startet...</h1>
    <div class="progress-bar-container"><div id="progress-bar"></div></div>
</div>

<div id="game-container">
    <div id="grid">
        <div class="field" data-index="1" data-x="1" data-y="1"></div>
        <div class="field" data-index="2" data-x="2" data-y="1"></div>
        <div class="field" data-index="3" data-x="3" data-y="1"></div>
        <div class="field" data-index="4" data-x="1" data-y="2"></div>
        <div class="field" data-index="5" data-x="2" data-y="2"></div>
        <div class="field" data-index="6" data-x="3" data-y="2"></div>
        <div class="field" data-index="7" data-x="1" data-y="3"></div>
        <div class="field" data-index="8" data-x="2" data-y="3"></div>
        <div class="field" data-index="9" data-x="3" data-y="3"></div>
        <div class="field" data-index="10" data-x="1" data-y="4"></div>
        <div class="field" data-index="11" data-x="2" data-y="4"></div>
        <div class="field" data-index="12" data-x="3" data-y="4"></div>
    </div>

    <div id="schnabel" data-sprite="stehend">
        <div id="schnabel-scale-wrapper">
            <img id="schnabel-img" src="Schnabel_stehend.png">
        </div>
    </div>

    <button id="btn-buddeln" disabled>Buddeln</button>

    <div id="result-layer" class="overlay-layer">
        <div id="result-display">
            <img id="found-item-img" class="found-img" src="Niete.png">
            <p id="found-quote" class="quote"></p>
            <button id="confirm-find-btn" class="run-btn">un!</button>
        </div>
    </div>

    <div id="summary-layer" class="overlay-layer">
        <div id="summary-display">
            <h2 style="margin-top:0; font-size: 2rem; margin-bottom: 10px;">Expedition beendet!</h2>
            <ul id="finds-list"></ul>
            
            <div class="summary-header">
                <img src="Währung.png" class="total-currency-img">
                <span class="summary-title">Verdientes Geld:</span>
            </div>
            <div id="final-sum-text" class="total-amount-text">0 Rollen</div>
            
            <button id="restart-btn" class="run-btn" style="background-color: #5a3d17;">Neue Expedition starten</button>
        </div>
    </div>
</div>

<script>
    const imagesToLoad = [
        'Hintergrund.png', 'Schnabel_stehend.png', 'Schnabel_laufend_links_1.png', 'Schnabel_laufend_links_2.png',
        'Schnabel_laufend_rechts_1.png', 'Schnabel_laufend_rechts_2.png', 'Schnabel_laufend_zurück_links_1.png',
        'Schnabel_laufend_zurück_links_2.png', 'Schnabel_laufend_zurück_rechts_1.png', 'Schnabel_laufend_zurück_rechts_2.png',
        'Schnabel_rauchend_1.png', 'Schnabel_rauchend_2.png', 'Buddel-Bursche_buddelnd-1.png', 'Buddel-Bursche_buddelnd-2.png',
        'Buddel-Bursche-Hurra.png', 'Loch_neu.png', 'Währung.png', 'Kanope_Anubis_Stil-1.png', 'Niete.png',
        'Buddel-Bursche_kritzelnd.png', 'Buddel-Bursche_Penoi.png', 'Pergament_Penoi.png', 'Pergament.png',
        'Kanope_C3PO_Stil-2.png', 'Kanope_Dino_Stil-2.png', 'No_Fritteuse.png', 'Relief_Ailiens_Dino.png', 'Rosetta_un.png',
        'Relief_Herbertep.png', 'Kanope_Herbertep_Stil-2.png', 'Herbertep.png', 'Dinosaurier.png'
    ];
    let loadedImages = 0;
    
    const findItems = {
        'niete': { img: 'Niete.png', text: '', value: 0 },
        'kanope': { img: 'Kanope_Anubis_Stil-1.png', text: '"Die wird mir eine schöne Rolle Geld einbringen!"', value: 1 },
        'pergament': { img: 'Pergament.png', text: '"Molto! Aber so bekomme ich dafür ja höchstens eine Rolle"', value: 0, buttonText: "Aufwerten" },
        'pergament-penoi': { img: 'Pergament_Penoi.png', text: '"Besser!"', value: 3, buttonText: "un!" },
        'kanope_c3po': { img: 'Kanope_C3PO_Stil-2.png', text: '"Das ist mir neu..."', value: 2 },
        'kanope_dino': { img: 'Kanope_Dino_Stil-2.png', text: '"Das ist mir neu..."', value: 2 },
        'relief_aliens': { img: 'Relief_Ailiens_Dino.png', text: '"Ich wusste es!"', value: 5 },
        'no_fritteuse': { img: 'No_Fritteuse.png', text: '"Wieder nur Werbung"', value: 4 },
        'rosetta': { img: 'Rosetta_un.png', text: '"Pupel-Sprache ist also nicht nur edel, sondern auch schon sehr alt"', value: 6 },
        'relief_herbertep': { img: 'Relief_Herbertep.png', text: '"Herbertep war schon damals ein Gott."', value: 7 },
        'kanope_herbertep': { img: 'Kanope_Herbertep_Stil-2.png', text: '"Mensch! Das ist selten."', value: 4 },
        'mumie_herbertep': { img: 'Herbertep.png', text: '"Herbertep! Es gab ihn wirklich!"', value: 10 },
        'dinosaurier': { img: 'Dinosaurier.png', text: '"Oh!"', value: 2 }
    };

    const fields = document.querySelectorAll('.field');
    const schnabel = document.getElementById('schnabel');
    const schnabelImg = document.getElementById('schnabel-img');
    const schnabelScaleWrapper = document.getElementById('schnabel-scale-wrapper');
    const gridEl = document.getElementById('grid');
    const gameContainer = document.getElementById('game-container');
    const btnBuddeln = document.getElementById('btn-buddeln');
    
    const resultLayer = document.getElementById('result-layer');
    const foundItemImg = document.getElementById('found-item-img');
    const foundQuote = document.getElementById('found-quote');
    const confirmFindBtn = document.getElementById('confirm-find-btn');
    
    const summaryLayer = document.getElementById('summary-layer');
    const findsList = document.getElementById('finds-list');
    const finalSumText = document.getElementById('final-sum-text');
    const restartBtn = document.getElementById('restart-btn');

    let isMoving = false, isDigging = false, showingResult = false;
    let walkStep = 1, walkInterval = null, currentDirection = null;
    let currentGridPos = { x: 1, y: 0.5 }, dugFields = new Set(), inventory = [], gameItems = [];
    let idleTimer = null, smokeInterval = null, digActionInterval = null;
    
    let latestDugLochElement = null; 

    function imageLoaded() {
        loadedImages++;
        document.getElementById('progress-bar').style.width = (loadedImages / imagesToLoad.length * 100) + '%';
        if (loadedImages === imagesToLoad.length) setTimeout(initGame, 500);
    }
    imagesToLoad.forEach(src => { const img = new Image(); img.onload = imageLoaded; img.onerror = imageLoaded; img.src = src; });

    function setSchnabelImage(filename, spriteState) {
        schnabelImg.src = filename;
        schnabel.dataset.sprite = spriteState;
    }

    function initGame() {
        document.getElementById('loading-screen').style.display = 'none';
        gameContainer.style.display = 'block';
        resetGame();
    }

    function resetGame() {
        document.querySelectorAll('.overlay-layer').forEach(l => l.style.display = 'none');
        btnBuddeln.style.display = 'block';
        inventory = [];
        dugFields.clear();
        
        document.querySelectorAll('.loch-img').forEach(img => img.remove());
        latestDugLochElement = null;
        
        let treasurePool = [
            'kanope', 'kanope_c3po', 'kanope_dino', 'relief_aliens', 'no_fritteuse', 
            'rosetta', 'relief_herbertep', 'kanope_herbertep', 'mumie_herbertep', 'dinosaurier'
        ];
        treasurePool.sort(() => Math.random() - 0.5); 
        let selectedTreasures = treasurePool.slice(0, 7);
        gameItems = ['niete', 'niete', 'niete', 'niete', 'pergament'].concat(selectedTreasures);
        gameItems.sort(() => Math.random() - 0.5); 
        
        currentGridPos = { x: 1, y: 0.5 };
        isDigging = false; isMoving = false; showingResult = false;
        setSchnabelImage('Schnabel_stehend.png', 'stehend');
        
        const coords = getPixelCoordsFromGrid(1, 0.5);
        updateSchnabelVisuals(coords.x, coords.y);
        updateButtonState();
        stopAllTimers();
    }

    function getPixelCoordsFromGrid(gX, gY) {
        const rect = gridEl.getBoundingClientRect(), container = gameContainer.getBoundingClientRect();
        return {
            x: (rect.left - container.left) + (gX - 0.5) * (rect.width / 3),
            y: (rect.top - container.top) + (gY - 0.5) * (rect.height / 4)
        };
    }

    function updateSchnabelVisuals(pxX, pxY) {
        const yStart = getPixelCoordsFromGrid(1, 0.5).y, yBottom = getPixelCoordsFromGrid(1, 4.0).y;
        const scale = 0.50 + (Math.max(0, Math.min(1, (pxY - yStart) / (yBottom - yStart))) * 0.50);
        schnabel.style.left = pxX + 'px'; schnabel.style.top = pxY + 'px';
        schnabelScaleWrapper.style.transform = `scale(${Math.max(0.1, scale)})`;
        return scale;
    }

    function stopAllTimers() { clearTimeout(idleTimer); clearInterval(smokeInterval); clearInterval(digActionInterval); }

    function startIdleTimer() {
        stopAllTimers();
        if (currentGridPos.y === 0.5 || showingResult || schnabel.dataset.sprite === 'kritzelnd' || schnabel.dataset.sprite === 'haltend') return;
        
        idleTimer = setTimeout(() => {
            let step = 1;
            setSchnabelImage(`Schnabel_rauchend_${step}.png`, `rauchend_${step}`);
            smokeInterval = setInterval(() => {
                step = step === 1 ? 2 : 1;
                setSchnabelImage(`Schnabel_rauchend_${step}.png`, `rauchend_${step}`);
            }, 1500);
        }, 3000);
    }

    function updateButtonState() {
        const key = `${currentGridPos.x}-${currentGridPos.y}`;
        btnBuddeln.disabled = (isMoving || isDigging || showingResult || currentGridPos.y === 0.5 || dugFields.has(key) || dugFields.size >= 3);
    }

    btnBuddeln.addEventListener('click', () => {
        isDigging = true; updateButtonState(); stopAllTimers();
        let step = 1, elapsed = 0;
        setSchnabelImage(`Buddel-Bursche_buddelnd-${step}.png`, `buddelnd_${step}`);
        
        digActionInterval = setInterval(() => {
            step = step === 1 ? 2 : 1; setSchnabelImage(`Buddel-Bursche_buddelnd-${step}.png`, `buddelnd_${step}`);
            elapsed += 500;
            if (elapsed >= 4000) { clearInterval(digActionInterval); finishDigging(); }
        }, 500);
    });

    function finishDigging() {
        const fieldEl = document.querySelector(`.field[data-x="${currentGridPos.x}"][data-y="${currentGridPos.y}"]`);
        dugFields.add(`${currentGridPos.x}-${currentGridPos.y}`);
        const coords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y);
        const currentScale = updateSchnabelVisuals(coords.x, coords.y);
        
        const loch = document.createElement('img');
        loch.src = 'Loch_neu.png'; 
        loch.className = 'loch-img latest-dug';
        latestDugLochElement = loch;
        
        const bottomPos = 50 - (28 * currentScale);
        loch.style.bottom = bottomPos + '%';
        loch.style.transform = `translateX(-50%) scale(${currentScale})`; 
        fieldEl.appendChild(loch);

        setSchnabelImage('Buddel-Bursche-Hurra.png', 'hurra');
        showingResult = true; updateButtonState();

        const itemKey = gameItems[parseInt(fieldEl.dataset.index) - 1];
        const item = findItems[itemKey];
        inventory.push(itemKey);

        document.getElementById('found-item-img').src = item.img;
        document.getElementById('found-quote').innerText = item.text;
        confirmFindBtn.innerText = item.buttonText || "un!"; 
        
        setTimeout(() => {
            resultLayer.style.display = 'flex';
        }, 1000);
    }

    confirmFindBtn.addEventListener('click', () => {
        resultLayer.style.display = 'none';
        
        if(confirmFindBtn.innerText === "Aufwerten") {
            foundQuote.innerText = ""; 
            setSchnabelImage('Buddel-Bursche_kritzelnd.png', 'kritzelnd'); 
            
            setTimeout(() => {
                setSchnabelImage('Buddel-Bursche_Penoi.png', 'haltend');
                
                setTimeout(() => {
                    showingResult = true; 
                    confirmFindBtn.innerText = "un!"; 
                    
                    document.getElementById('found-item-img').src = findItems['pergament-penoi'].img;
                    document.getElementById('found-quote').innerText = findItems['pergament-penoi'].text;
                    resultLayer.style.display = 'flex';
                    
                    inventory.push('pergament-penoi');
                }, 1000);
            }, 2000);

        } else {
            showingResult = false; isDigging = false;
            
            if(latestDugLochElement) {
                latestDugLochElement.classList.remove('latest-dug');
            }
            
            if (dugFields.size >= 3) {
                showSummary();
            } else {
                setSchnabelImage('Schnabel_stehend.png', 'stehend');
                updateButtonState(); startIdleTimer();
            }
        }
    });

    function showSummary() {
        findsList.innerHTML = '';
        let total = 0;
        
        inventory.forEach(key => {
            if(key === 'pergament') return;
            
            const item = findItems[key];
            total += item.value;
            const li = document.createElement('li');
            const rollText = item.value === 1 ? "1 Rolle" : `${item.value} Rollen`;
            li.innerHTML = `<img src="${item.img}" class="list-icon"> <span>${rollText}</span>`;
            findsList.appendChild(li);
        });
        
        finalSumText.innerText = total === 1 ? "1 Rolle" : `${total} Rollen`;
        summaryLayer.style.display = 'flex';
        btnBuddeln.style.display = 'none';
    }

    restartBtn.addEventListener('click', resetGame);

    function startWalkAnimation(fromX, fromY, toX, toY) {
        clearInterval(walkInterval);
        
        currentDirection = "";
        let dx = toX - fromX;
        let dy = toY - fromY;

        if (Math.abs(dx) < 1) { 
            if (dy < 0) currentDirection = "zurück_rechts"; 
            else currentDirection = "rechts";               
        } else if (dx < 0) {
            if (dy < 0) currentDirection = "zurück_links";  
            else currentDirection = "links";                
        } else {
            if (dy < 0) currentDirection = "zurück_rechts"; 
            else currentDirection = "rechts";               
        }

        walkStep = 1;
        setSchnabelImage(`Schnabel_laufend_${currentDirection}_${walkStep}.png`, `laufend_${currentDirection}_${walkStep}`);

        walkInterval = setInterval(() => {
            walkStep = walkStep === 1 ? 2 : 1;
            setSchnabelImage(`Schnabel_laufend_${currentDirection}_${walkStep}.png`, `laufend_${currentDirection}_${walkStep}`);
        }, 180); 
    }

    function stopWalkAnimation() {
        clearInterval(walkInterval);
        setSchnabelImage('Schnabel_stehend.png', 'stehend');
        walkStep = 1;
        currentDirection = null; 
    }

    function moveToTarget(tX, tY) {
        stopAllTimers(); updateButtonState();
        const startCoords = getPixelCoordsFromGrid(currentGridPos.x, currentGridPos.y), targetCoords = getPixelCoordsFromGrid(tX, tY);
        
        startWalkAnimation(startCoords.x, startCoords.y, targetCoords.x, targetCoords.y);

        const dist = Math.sqrt(Math.pow(targetCoords.x - startCoords.x, 2) + Math.pow(targetCoords.y - startCoords.y, 2));
        const avgScaleBase = (updateSchnabelVisuals(startCoords.x, startCoords.y) + updateSchnabelVisuals(targetCoords.x, targetCoords.y)) / 2;
        const duration = (dist * 6) / avgScaleBase; 
        
        let startTime = null;

        function animate(time) {
            if (!startTime) startTime = time;
            const progress = Math.min((time - startTime) / duration, 1);
            updateSchnabelVisuals(startCoords.x + (targetCoords.x - startCoords.x) * progress, startCoords.y + (targetCoords.y - startCoords.y) * progress);
            if (progress < 1) requestAnimationFrame(animate);
            else {
                currentGridPos = { x: tX, y: tY }; isMoving = false; clearInterval(walkInterval);
                setSchnabelImage('Schnabel_stehend.png', 'stehend');
                updateButtonState(); startIdleTimer();
            }
        }
        requestAnimationFrame(animate);
    }

    fields.forEach(field => {
        field.addEventListener('click', (e) => {
            const xMark = document.createElement('div');
            xMark.className = 'tap-x'; xMark.innerText = 'X';
            
            const rect = field.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            const centerX = (rect.left - containerRect.left) + rect.width / 2;
            const centerY = (rect.top - containerRect.top) + rect.height / 2;
            
            xMark.style.left = centerX + 'px'; 
            xMark.style.top = centerY + 'px';
            gameContainer.appendChild(xMark);
            
            setTimeout(() => xMark.remove(), 500);

            if (isMoving || isDigging || showingResult || dugFields.size >= 3 || schnabel.dataset.sprite === 'kritzelnd' || schnabel.dataset.sprite === 'haltend') return;

            const tX = parseInt(field.dataset.x);
            const tY = parseInt(field.dataset.y);

            if(tX === currentGridPos.x && tY === currentGridPos.y) return;

            isMoving = true; 
            moveToTarget(tX, tY);
        });
    });
</script>

</body>
</html>
